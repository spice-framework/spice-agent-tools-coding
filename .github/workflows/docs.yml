name: Documentation

on:
  push:
    branches: [main]
    paths:
      - spice-docs.json
      - "**/*.md"
      - "**/*.go"
      - "docs/**"
      - "profile/**"
      - "store/assets/**"
  pull_request:
    branches: [main]
    paths:
      - spice-docs.json
      - "**/*.md"
      - "**/*.go"
      - "docs/**"
      - "profile/**"
      - "store/assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    uses: spice-framework/.github/.github/workflows/docs-source.yml@41c8ffdc30a57ab05a0a2d1cbd534581d5450ef9
    with:
      docs_commit: 0d2dd04ad4cbb1664aead72b6b162d00219246c2
