name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-module-release.yml@26de6f4b78a64eedb21e15a2ffe8aa3fd579ef16
    with:
      module: github.com/spice-framework/spice-agent-tools-coding
      workflow_commit: 26de6f4b78a64eedb21e15a2ffe8aa3fd579ef16
